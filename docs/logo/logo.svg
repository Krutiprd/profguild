<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3b1a12"/>
      <stop offset="1" stop-color="#0d0605"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset="0.45" stop-color="#e2b13c"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b2418"/>
      <stop offset="1" stop-color="#3a0a06"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.5" stop-color="#a9b1ba"/>
      <stop offset="1" stop-color="#5d646c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3314"/>
      <stop offset="0.5" stop-color="#a8692c"/>
      <stop offset="1" stop-color="#5a3314"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- rings -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#6b4a1f" stroke-width="2"/>
  <g fill="url(#gold)">
    <circle cx="200" cy="18" r="6"/><circle cx="200" cy="382" r="6"/>
    <circle cx="18" cy="200" r="6"/><circle cx="382" cy="200" r="6"/>
  </g>

  <!-- shield -->
  <path d="M200 62 L312 100 L302 232 Q290 304 200 344 Q110 304 98 232 L88 100 Z"
        fill="url(#shield)" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M200 84 L292 115 L284 228 Q274 288 200 322 Q126 288 116 228 L108 115 Z"
        fill="none" stroke="#e2b13c" stroke-opacity="0.45" stroke-width="2"/>

  <!-- needle with thread, leaning right -->
  <g transform="rotate(38 200 212)" filter="url(#shadow)">
    <path d="M200 92 Q207 96 207 112 L204 318 L200 338 L196 318 L193 112 Q193 96 200 92 Z" fill="url(#steel)" stroke="#3a3f45" stroke-width="1.5"/>
    <ellipse cx="200" cy="110" rx="2.6" ry="9" fill="#2a0a06"/>
    <path d="M200 104 C 236 120, 236 160, 200 176 C 164 192, 164 232, 200 248 C 236 264, 236 300, 214 318"
          fill="none" stroke="#f0c75a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- hammer, leaning left -->
  <g transform="rotate(-38 200 212)" filter="url(#shadow)">
    <rect x="192" y="128" width="16" height="200" rx="6" fill="url(#wood)" stroke="#2d1607" stroke-width="2"/>
    <rect x="190" y="300" width="20" height="30" rx="5" fill="#3d220d" stroke="#2d1607" stroke-width="2"/>
    <path d="M150 100 L246 100 Q256 100 256 110 L256 138 Q256 148 246 148 L150 148 L140 134 L140 114 Z"
          fill="url(#steel)" stroke="#3a3f45" stroke-width="2.5"/>
    <rect x="186" y="96" width="28" height="56" rx="3" fill="url(#gold)" stroke="#6b4a1f" stroke-width="2"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff1b0">
    <path d="M140 236 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" opacity="0.9"/>
    <path d="M282 196 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" opacity="0.8"/>
  </g>
</svg>
